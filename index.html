<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="camou — Gleiche Fragen. Neue Perspektiven.">
  <title>camou — independent artist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module" src="script.js"></script>
</head>

<body>
  <main class="experience">

    <header class="topbar">
      <a class="logo" href="#" id="logo">camou<span>.</span></a>

      <nav class="navigation" aria-label="Hauptnavigation">
        <button class="nav-link active" data-section="0">Home</button>
        <button class="nav-link" data-section="1">Music</button>
        <button class="nav-link" data-section="2">Visuals</button>
        <button class="nav-link" data-section="3">Archive</button>
        <button class="nav-link" data-section="4">Contact</button>
      </nav>

      <div class="top-note">
        INDEPENDENT ARTIST / SWITZERLAND
      </div>
    </header>

    <section class="globe-stage" aria-label="Drehbare Camou-Kugel">

      <div id="globe"></div>
      <!-- CONTACT: echtes Formular, nur ueber der Vorderseite der Kugel sichtbar -->
      <div class="globe-contact" id="globe-contact" aria-hidden="true">
        <form id="camou-contact-form" class="camou-contact-form" aria-label="Kontaktformular">
          <div class="camou-contact-heading">NACHRICHT SCHREIBEN</div>
          <label for="camou-name">name</label>
          <input id="camou-name" name="name" autocomplete="name" placeholder="dein name" required>
          <label for="camou-email">e-mail</label>
          <input id="camou-email" name="email" type="email" autocomplete="email" placeholder="deine@mail.com" required>
          <label for="camou-subject">betreff</label>
          <input id="camou-subject" name="subject" placeholder="um was gehts?" required>
          <label for="camou-message">nachricht</label>
          <textarea id="camou-message" name="message" placeholder="hallo camou, ..." required></textarea>
          <div class="camou-honeypot" aria-hidden="true"><label for="camou-website">website</label><input id="camou-website" name="website" tabindex="-1" autocomplete="off"></div>
          <label class="camou-consent"><input type="checkbox" name="privacy" value="zugestimmt" required><span>meine angaben dürfen zur beantwortung/verarbeitung gespeichert werden</span></label>
          <a class="camou-privacy-link" href="impressum.html">impressum / datenschutz</a>
          <button type="submit" id="camou-send">nachricht senden →</button>
          <p id="camou-form-status" role="status" aria-live="polite"></p>
        </form>
      </div>


      <div class="zoom-controls" aria-label="Zoom">
        <button id="zoom-in" aria-label="Vergrößern">+</button>
        <button id="zoom-out" aria-label="Verkleinern">−</button>
        <button id="zoom-reset" aria-label="Zoom zurücksetzen">↺</button>
      </div>

      <div class="interaction-hint" id="hint">
        <span class="hint-dot"></span>
        DRAG TO EXPLORE
      </div>

      <div class="section-indicator">
        <span id="current-section">HOME</span>
        <span class="indicator-line"></span>
        <span id="section-number">01 / 05</span>
      </div>

    </section>

    <footer class="footer">
      <span>camou — independent artist / Switzerland</span>

      <div class="footer-links">
        <a href="#" id="instagram-link">Instagram</a>
        <a href="#" id="spotify-link">Spotify</a>
        <a href="mailto:camou.kontakt@gmail.com">Contact ↗</a>
      </div>
    </footer>

  </main>
</body>
</html>
